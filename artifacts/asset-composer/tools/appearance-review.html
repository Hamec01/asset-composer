<!doctype html>
<html lang="ru">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Appearance Preset Review</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; padding: 24px; background: #202225; color: #eee; font: 14px system-ui, sans-serif; }
  h1 { font-size: 22px; margin: 0 0 20px; }
  h2 { font-size: 17px; margin: 20px 0 12px; }
  section { display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: 12px; }
  figure { margin: 0; border: 1px solid #4b4e50; border-radius: 4px; background: #35393b; padding: 8px; }
  .portrait { width: 100%; aspect-ratio: 1; position: relative; }
  svg { position: absolute; inset: 0; width: 100%; height: 100%; }
  figcaption { min-height: 36px; font-size: 12px; text-align: center; overflow-wrap: anywhere; }
</style>
<h1>Глаза и причёски</h1>
<h2>Глаза</h2><section id="eyes"></section>
<h2>Причёски</h2><section id="hair"></section>
<script type="module">
  import { APPEARANCE_PRESETS, chibiFeatureSvg } from '/src/data/characterAppearance.ts';
  const head = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="-27 -29 54 70"><path d="M-21 2 C-28 -1 -27 11 -21 11 C-20 25 20 25 21 11 C27 11 28 -1 21 2 C23 -24 -23 -24 -21 2Z" fill="#ffd0a8" stroke="#654831" stroke-width=".8"/></svg>';
  for (const feature of ['eyes', 'hair']) {
    for (const preset of APPEARANCE_PRESETS[feature].filter(preset => preset.id !== 'none')) {
      const figure = document.createElement('figure');
      const portrait = document.createElement('div');
      portrait.className = 'portrait';
      portrait.innerHTML = head + chibiFeatureSvg('eyes', feature === 'eyes' ? preset.id : 'dot_cute', '#33241f')
        + (feature === 'hair' ? chibiFeatureSvg('hair', preset.id, '#835231') : '');
      const caption = document.createElement('figcaption');
      caption.textContent = preset.label;
      figure.append(portrait, caption);
      document.getElementById(feature).append(figure);
    }
  }
</script>
</html>
